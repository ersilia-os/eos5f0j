Slug: checkmol-functional-groups
Status: In progress
Title: CheckMol functional group census
Description: CheckMol analyses a molecule for the presence of functional groups 
  and structural elements, recognising ca. 200 distinct functional-group types; 
  alcohols, carbonyls, carboxylic acids, amines, halides, heterocycles, and many
  more. For each input compound it returns a fixed-length vector of 
  functional-group counts, providing an interpretable, rule-based molecular 
  descriptor rather than an abstract learned embedding.
