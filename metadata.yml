Title: CheckMol functional group census
Description: Counts occurrences of 204 functional group types in a molecule, 
  spanning alcohols, carbonyls, carboxylic acids, amines, halides, heterocycles 
  and many more. Haider released checkmol as an open-source command-line program
  alongside the MolDB structure-database package, and it perceives groups 
  through explicit chemical rules rather than a learned model, so every count 
  traces to a defined group and stays interpretable, unlike a hashed 
  fingerprint. Molecules that cannot be parsed return empty values rather than 
  zeros, which separates failure from genuine absence.
